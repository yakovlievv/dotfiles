# Super key binds. Saving this file applies it (or run `superkey`).
# Super = Left Command. `superkey list` prints everything, `superkey edit` opens this.
#
#   COMBO                 ACTION    ARGUMENT
#   SUPER + B             toggle    app.zen-browser.zen     open/focus the app, hide it if it's in front
#   SUPER + SHIFT + S     send      cmd+shift+3             press another shortcut (cmd shift ctrl alt fn)
#   SUPER + V             vicinae   clipboard:history       run a Vicinae command (`vicinae cmd ls`)
#   SUPER + A             win       almost                  resize the front window: almost | maximize
#   SUPER + CTRL + S      shell     some command            run a shell command (no PATH, use full paths)
#   SUPER + Q             pass                              leave it as plain Command+Q
#
# Combos: SUPER + key, or SUPER + one of SHIFT / ALT / CTRL / CMD (CapsLock) + key.
# Keys: a-z, 0-9, RETURN, SPACE, BACKSPACE, LEFT, RIGHT, UP, DOWN, MINUS, EQUAL,
#   COMMA, PERIOD, SLASH, BACKSLASH, SEMICOLON, QUOTE, [, ]
# Any Super combo not listed here sends the hyper-style combo (SUPER + X = ctrl+opt+shift+cmd+X),
# so Raycast/Vicinae can still record them. Tab always passes through (Super+Tab switches apps).
# App bundle ids: osascript -e 'id of app "Emacs"'

# apps
SUPER + B              toggle    app.zen-browser.zen
SUPER + RETURN         toggle    com.mitchellh.ghostty
SUPER + E              toggle    org.gnu.Emacs
SUPER + T              toggle    ru.keepcoder.Telegram
SUPER + C              toggle    com.anthropic.claudefordesktop
SUPER + SHIFT + C      toggle    com.apple.iCal
SUPER + N              toggle    com.apple.Notes
SUPER + R              toggle    com.apple.reminders
SUPER + O              toggle    com.apple.mobilephone
SUPER + Y              toggle    com.apple.findmy

# windows: H/L are macOS's native tiling, A/M go through bin/win
SUPER + H              send      fn+ctrl+left
SUPER + L              send      fn+ctrl+right
SUPER + A              win       almost
SUPER + M              win       maximize

# system
# screenshots: save to ~/Pictures/Screenshots and copy to the clipboard
SUPER + S              shell     /Users/yako/dotfiles/karabiner/screenshot region
SUPER + SHIFT + S      shell     /Users/yako/dotfiles/karabiner/screenshot screen
# macOS "Shut down?" dialog (Return confirms, auto shuts down after 60s)
SUPER + CTRL + S       shell     osascript -e 'tell application "loginwindow" to «event aevtrsdn»'

# stay plain Command
SUPER + Q              pass
SUPER + W              pass
