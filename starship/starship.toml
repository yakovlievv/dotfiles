"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
# palette = "catppuccin_mocha"
palette = "kanagawa"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$fill\
$cmd_duration\
$time
$character"""

right_format = """
$jobs\
$nodejs\
$python\
$c\
$lua"""

[hostname]
ssh_only = true
format = "[$hostname](bold red) "

[username]
show_always = false
format = "[$user](bold red)@"

[fill]
symbol = "."
style = "overlay0"

[time]
disabled = false
format = " [ $time]($style)"
time_format = "%H:%M:%S"
style = "bold overlay1"

[character]
success_symbol = "[❯](lavender)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](subtext1)"

[directory]
truncation_length = 4
style = "bold lavender"

[git_branch]
style = "bold mauve"

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)](bold yellow)\) '
rebase = "REBASE"
merge = "MERGE"
cherry_pick = "PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"


[cmd_duration]
min_time = 2_000
format = "[ $duration](bold overlay1)"
show_milliseconds = false

[jobs]
symbol = " "
style = "bold maroon"
number_threshold = 1
format = "[$symbol$number]($style) "

[nodejs]
format = "[ $version](bold green) "
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[python]
format = '[ ${pyenv_prefix}${version}( \($virtualenv\))](bold yellow) '
detect_files = [
    "pyproject.toml",
    "requirements.txt",
    "setup.py",
    ".python-version",
    "Pipfile",
]
detect_extensions = ["py"]
python_binary = ["python3", "python"]

[c]
format = "[ $version(-$name)](bold sapphire) "
detect_extensions = ["c", "h", "cpp", "hpp"]

[lua]
format = "[ $version](bold blue) "
detect_files = [".lua-version"]
detect_extensions = ["lua"]

[palettes.kanagawa]
rosewater = "#DCD7BA"
flamingo = "#C8C093"
pink = "#D27E99"
mauve = "#957FB8"
red = "#E46876"
maroon = "#FF5D62"
peach = "#FFA066"
yellow = "#E6C384"
green = "#98BB6C"
teal = "#7AA89F"
sky = "#A3D4D5"
sapphire = "#7FB4CA"
blue = "#7E9CD8"
lavender = "#9CABCA"
text = "#DCD7BA"
subtext1 = "#C8C093"
subtext0 = "#938AA9"
overlay2 = "#9CABCA"
overlay1 = "#938AA9"
overlay0 = "#717C7C"
surface2 = "#727169"
surface1 = "#54546D"
surface0 = "#363646"
base = "#1F1F28"
mantle = "#16161D"
crust = "#0D0C0C"

