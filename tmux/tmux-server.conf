set -g prefix C-a
bind C-a last-window

set -g status-position bottom
set -g status-interval 5

# Remote/server accent — distinct from the desktop's mauve so local vs. remote
# reads at a glance. Prefix still flips to red. Held as a literal hex (not
# "#{@thm_peach}") because tmux won't recursively re-expand a nested format.

set -g status-style bg=default
set -g status-left "\
#[fg=#{?client_prefix,#{@thm_red},#{@thm_pink}}] #S\
#[bg=default,fg=#{@thm_surface_1}]  #(short-path \"#{pane_current_path}\")\
#[bg=default,fg=default]"
set -g status-right "\
#[fg=#{@thm_surface_1}]up #[fg=#{@thm_teal}]#(uptime -p | sed 's/up //;s/ days*/d/;s/ hours*/h/;s/ minutes*/m/;s/,//g') \
#[fg=#{@thm_surface_1}]load #[fg=#{@thm_peach}]#(cut -d' ' -f1-3 /proc/loadavg) \
#[fg=#{@thm_surface_1}]mem #[fg=#{@thm_blue}]#(free -m | awk '/Mem:/{printf \"%d%%\", $3/$2*100}') \
#[fg=#{@thm_surface_1}]disk #[fg=#{@thm_green}]#(df -h / | awk 'NR==2{print $5}')"
set -g window-status-style "fg=#{@thm_surface_1}"
set -g window-status-current-style "fg=#{@thm_lavender} bold"
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify centre
