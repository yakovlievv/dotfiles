source-file ~/.config/tmux/binds.conf

set -g mouse on
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ',xterm-kitty:Tc:sitm=\E[=1s'
set -ga terminal-overrides ',wezterm:Tc'
# undercurl + colored underline passthrough (squiggly diagnostics, gray context separator)
set -as terminal-features '*:usstyle'
set -s extended-keys always
# neovim parses the kitty CSI-u key form, not the default xterm "CSI 27~" form
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'wezterm:extkeys'
set -as terminal-features 'ghostty:extkeys'
set -g allow-passthrough on
set -ga update-environment "TERM_PROGRAM"

set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 10
set -g focus-events on
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g mode-keys vi

set -g @catppuccin_window_status_style "none"
set -g @catppuccin_status_background none

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Use Alt+h/j/k/l instead of the default Ctrl (avoids clashing with the
# claudecode terminal's line-editing keys). Pairs with nvim's <M-hjkl> maps.
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_prev ""

# --- Theme palette -----------------------------------------------------------
# The catppuccin plugin sets its @thm_* palette with "set -ogq", so anything
# defined here (before tpm runs) wins and the plugin keeps its formats.
# To go back to Catppuccin Mocha: comment out the kanagawa block below and the
# plugin's own mocha palette takes over again.

# Kanagawa (wave)
set -g @thm_bg "#1F1F28"
set -g @thm_fg "#DCD7BA"

set -g @thm_rosewater "#DCD7BA"
set -g @thm_flamingo "#C8C093"
set -g @thm_pink "#D27E99"
set -g @thm_mauve "#957FB8"
set -g @thm_red "#E46876"
set -g @thm_maroon "#FF5D62"
set -g @thm_peach "#FFA066"
set -g @thm_yellow "#E6C384"
set -g @thm_green "#98BB6C"
set -g @thm_teal "#7AA89F"
set -g @thm_sky "#A3D4D5"
set -g @thm_sapphire "#7FB4CA"
set -g @thm_blue "#7E9CD8"
set -g @thm_lavender "#9CABCA"

set -g @thm_subtext_1 "#938AA9"
set -g @thm_subtext_0 "#C8C093"
set -g @thm_overlay_2 "#9CABCA"
set -g @thm_overlay_1 "#938AA9"
